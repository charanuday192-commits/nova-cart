<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1e1b3a;--mut:#6b6785;--line:#e4e0f7;--pri:#5b4bd5;--prid:#4636b8;--soft:#eeebff;--hd:#1b1445;--okb:#d9f5e5;--okf:#0c6b3a;--wb:#fdf0c9;--wf:#8a5a00;--bb:#fde0e0;--bf:#8e2a2a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12101f;--card:#1c1930;--ink:#ece9ff;--mut:#a29fc0;--line:#322d52;--soft:#2a2550;--okb:#12392a;--okf:#7be0a8;--wb:#3e3210;--wf:#f2c864;--bb:#47191d;--bf:#ff9a9a}}
:root[data-theme="dark"]{--bg:#12101f;--card:#1c1930;--ink:#ece9ff;--mut:#a29fc0;--line:#322d52;--soft:#2a2550;--okb:#12392a;--okf:#7be0a8;--wb:#3e3210;--wf:#f2c864;--bb:#47191d;--bf:#ff9a9a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.bar0{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px}.logo b{color:#b7acff}
nav{display:flex;flex-wrap:wrap;gap:4px}nav button{background:none;border:0;color:#fff;padding:8px 12px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button.on{background:var(--pri)}
h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0;max-width:760px}
h2{margin:0 0 6px;font-size:20px}
.hero{background:linear-gradient(135deg,#4f3fcf,#7a3fc0);color:#fff;border-radius:24px;padding:clamp(24px,5vw,48px)}
.hero p{max-width:620px;color:#e3defe}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:20px}@media(max-width:860px){.cols{grid-template-columns:1fr}}
.btn{border:0;border-radius:12px;padding:9px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;background:var(--pri);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn:hover{background:var(--prid)}
.btn.s{background:var(--soft);color:var(--pri)}.btn.d{background:var(--bb);color:var(--bf)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.ok{background:var(--okb);color:var(--okf)}.wn{background:var(--wb);color:var(--wf)}.bd{background:var(--bb);color:var(--bf)}.tag{background:var(--pri);color:#fff}.tg2{background:var(--soft);color:var(--pri)}
.mut{color:var(--mut);font-size:13px}.big{font-size:26px;font-weight:800}
.meter{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;transition:width .6s}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
input[type=text],input[type=password],select{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--pri);font:600 13px inherit;font-family:inherit;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
button,input,select{font:inherit}
 table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 8px;text-align:left;border-top:1px solid var(--line)}th{border:0;color:var(--mut)}
.scroll{overflow-x:auto}.pop{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}.bars i{display:block;width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#a295ff,#5b4bd5)}
.warnbox{border:2px solid #e0a800;background:var(--wb)}
.thumb{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pri);font-size:30px;flex-shrink:0}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;font-family:inherit;cursor:pointer}.opt i{width:22px;height:22px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}.opt.on{border-color:var(--pri);background:var(--soft)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--pri);margin:0 auto 12px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.2s ease-out infinite}@keyframes pulse{0%{transform:scale(.8);opacity:.8}70%{transform:scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.pop,.meter i,.spin,.pulse{animation:none;transition:none}}
</style>
</head>
<body>
<header><div class="wrap bar0"><div class="logo">NOVA <b>Cart</b></div><nav id="nav"></nav></div></header>
<main class="wrap" id="app"></main>
<script>
// ---------- Synthetic data (NOVA CART case) ----------
const stores=[
{id:'s1',name:'Sai Lakshmi Stores',rel:.94,eta:24,dist:1.2,load:.45,local:.9,orders:212,fulfil:94},
{id:'s2',name:'City Fresh Mart',rel:.88,eta:31,dist:2.1,load:.6,local:.5,orders:340,fulfil:88},
{id:'s3',name:'Local Basket',rel:.81,eta:35,dist:2.8,load:.35,local:.8,orders:158,fulfil:81},
{id:'s4',name:'Metro Daily',rel:.9,eta:28,dist:1.8,load:.5,local:.4,orders:275,fulfil:90}];
const CITY={'Visakhapatnam':[17.6868,83.2185],'Vizianagaram':[18.1067,83.3955],'Srikakulam':[18.2949,83.8938],'Anakapalli':[17.6913,83.0037]};
const GEO={s1:[17.6935,83.2250],s2:[17.6800,83.2102],s3:[17.7005,83.2060],s4:[17.6760,83.2340]};
function shopArt(n,h){const e=n.replace(/&/g,'&amp;'),st=[0,1,2,3,4,5,6,7].map(i=>`<rect x="${30+i*32.5}" y="62" width="32.5" height="26" fill="${i%2?'#fff':`hsl(${h} 65% 48%)`}"/>`).join('');
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><rect width="320" height="200" fill="hsl(${h} 40% 90%)"/><rect y="160" width="320" height="40" fill="#b9b4a8"/><rect x="30" y="52" width="260" height="96" rx="18" fill="rgba(255,255,255,.28)"/><g fill="${h>180?'#3a2d1f':'#2d2335'}">${st}</g><text x="160" y="104" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="800" fill="#1f2340">${e.substr(0,15)}</text></svg>`;
 return'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
stores.forEach((s,i)=>{[s.lat,s.lng]=GEO[s.id];s.city='Visakhapatnam';s.addr='Sample position near the city centre';s.photo=shopArt(s.name,[255,150,30,330][i])});
const LISTED=[['Vizianagaram','Fort Road Fresh Mart',18.1089,83.3921,.92,265],['Vizianagaram','Sri Lakshmi Kirana',18.1031,83.4002,.87,25],['Srikakulam','Seven Roads Daily Needs',18.2975,83.8970,.91,445],['Anakapalli','Tirumala Mini Mart',17.6952,83.0055,.84,130],['Visakhapatnam','Bharat Market',17.6883,83.2120,.93,310],['Visakhapatnam','Swayam Daily',17.6799,83.2255,.89,190]]
 .map(([city,name,lat,lng,rel,h],i)=>({id:'L'+i,name,city,lat,lng,rel,addr:'Sample position near the city centre',photo:shopArt(name,h)}));
const cat=[['Milk',28,[96,71,82,0]],['Toned Milk',26,[92,85,0,88]],['Curd',35,[90,78,84,80]],['Bread',40,[88,90,70,86]],['Pav',30,[85,0,76,82]],['Eggs (6)',54,[93,80,0,91]],['Paneer',95,[84,91,66,92]],['Atta',58,[80,82,85,88]],['Rice',62,[89,81,90,77]],['Onion',34,[70,75,0,0]]];
const subs={Milk:['Toned Milk','Curd'], 'Toned Milk':['Milk','Curd'], Bread:['Pav'], Pav:['Bread'], Curd:['Milk'], Atta:['Rice'], Rice:['Atta']};
const base={orders:38500,aov:486,repeat:27,cancel:11,delivery:37,tickets:5900,unavail:35};
const trend={m:['Apr','May','Jun','Jul','Aug','Sep'],repeat:[41,38,34,31,29,27],cancel:[6,7,8,9,10,11],delivery:[29,31,33,34,36,37],tickets:[3100,3600,4200,4800,5400,5900]};
let inv=[],exc=[],orders=[],seq=1;
function seed(){inv=[];exc=[];orders=[];seq=1;
 cat.forEach(([p,pr,cs])=>cs.forEach((c,i)=>c>0&&inv.push({sid:stores[i].id,p,pr:pr+[0,2,-1,1][i],conf:c,on:true})));
 inv.filter(i=>i.conf<75).forEach(i=>exc.push({id:seq++,sid:i.sid,p:i.p,conf:i.conf,open:true,why:i.conf<70?'Not updated for 2+ days':'Stock last confirmed 36h ago'}));}
seed();
// ---------- Decision engine ----------
const W={reliable:{inv:.4,rel:.3,eta:.15,dist:.1,cap:.05,local:0},fastest:{inv:.2,rel:.15,eta:.4,dist:.2,cap:.05,local:0},local:{inv:.3,rel:.2,eta:.1,dist:.15,cap:.05,local:.2}};
const cl=x=>Math.max(0,Math.min(1,x)),pc=x=>Math.round(x*1000)/10;
function rank(p,mode,ex=[]){const w=W[mode];
 return inv.filter(i=>i.p===p&&i.on&&!ex.includes(i.sid)).map(i=>{const s=stores.find(x=>x.id===i.sid);
  const v={inv:i.conf/100,rel:s.rel,eta:cl(1-(s.eta-15)/45),dist:cl(1-s.dist/5),cap:1-s.load,local:s.local};
  const score=Object.keys(w).reduce((a,k)=>a+w[k]*v[k],0);
  return{s,p,pr:i.pr,inv:i.conf,rel:pc(s.rel),eta:s.eta,dist:s.dist,load:Math.round(s.load*100),score:pc(score),parts:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,pc(x)]))}})
  .sort((a,b)=>b.score-a.score).map((r,k)=>({...r,rank:k}));}
function search(){const q=S.q.trim().toLowerCase();const names=[...new Set(inv.map(i=>i.p))].filter(n=>n.toLowerCase().includes(q));
 const p=names.find(n=>n.toLowerCase()===q)||names[0];return{p,res:p?rank(p,S.mode):[]};}
function stockout(){const c=S.cart;const row=inv.find(i=>i.p===c.p&&i.sid===c.sid);row.on=false;row.conf=0;
 if(!exc.some(e=>e.p===c.p&&e.sid===c.sid&&e.open))exc.push({id:seq++,sid:c.sid,p:c.p,conf:0,open:true,why:'Picker reported item missing during an order'});
 const alt=rank(c.p,S.mode,[c.sid])[0]||null;const ss=(subs[c.p]||[]).flatMap(p=>rank(p,S.mode));
 const sub=ss.find(r=>r.s.id===c.sid)||ss.sort((a,b)=>b.score-a.score)[0]||null;S.risk={from:c,alt,sub};}
const status=o=>({placed:'Placed',accepted:'Rider assigned',picked:'Out for delivery',delivered:'Delivered'})[o.st];
// ---------- UI helpers ----------
const S={tab:'story',q:'Milk',mode:'reliable',cart:null,risk:null,msg:'',store:'s1',sort:'fulfil',r:60,last:[],reg:R0(),user:null,me:{lat:17.6868,lng:83.2185,src:'demo'},city:'Visakhapatnam',trav:'driving',ssort:'rel',pay:null,payFail:false,pc:{p:'Milk',sid:'s1',qty:1},coupon:'',cerr:'',rider:{id:'R1001',name:'Ravi',veh:'Bike',online:false,loc:null,mode:'off',err:'',tm:null,wid:null}};
const inr=n=>'₹'+n.toLocaleString('en-IN'),esc=s=>String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const t=(v,g=85,w=70)=>v>=g?'ok':v>=w?'wn':'bd';
const pill=(v,x)=>`<span class="pill ${t(v)}">${x}</span>`;
const meter=(v,c)=>`<div class="meter"><i style="width:${v}%;background:${c||'var(--pri)'}"></i></div>`;
const kpi=(l,v,s,bad)=>`<div class="card" style="margin:0"><div class="mut">${l}</div><div class="big">${v}</div><div class="mut" style="${bad?'color:var(--bf)':''}">${s}</div></div>`;
const bars=(ti,vals,u,c)=>{const mx=Math.max(...vals);return`<div class="card" style="margin:0"><b>${ti}</b><div class="bars" style="margin-top:12px">${vals.map((v,i)=>`<div><span class="mut">${v}${u}</span><i style="height:${(v/mx)*100}%;background:${c}"></i></div>`).join('')}</div></div>`};
const btn=(a,l,k='',d='')=>`<button class="btn ${k}" data-a="${a}" ${d}>${l}</button>`;
const fresh=r=>({s:r.s.id,sn:r.s.name,p:r.p,pr:r.pr,eta:r.eta,inv:r.inv,dist:r.dist,qty:1});
// ---------- Views ----------
function story(){const st=[['Problem','Orders grew, but trust fell: cancellations 6% → 11%, repeat purchase 41% → 27%, delivery 29 → 37 min.'],['Insight','35% of cancellations come from unavailable items and last-mile delays.'],['Fix','NOVA Cart ranks stores by reliability, stock certainty and local availability before checkout.'],['Result','Better fulfilment, fewer surprises, and more repeat orders.']];
 return`<div class="hero"><h1>From growth at any cost to reliable local commerce</h1><p>NOVA Cart helps customers know whether their order will arrive complete, and helps 620 partner stores keep inventory dependable.</p>${btn('tab:customer','Explore the demo','s')}</div><div class="g g2" style="margin:18px 0">${st.map(([a,b],i)=>`<div class="card" style="margin:0"><div class="mut">Step ${i+1}</div><b style="font-size:18px">${a}</b><p class="mut" style="margin:6px 0 0">${b}</p></div>`).join('')}</div><div class="card" style="background:var(--soft)"><h2>Why NOVA Cart?</h2><p style="max-width:720px;margin:0">Quick-commerce rivals compete on discounts and speed. NOVA Cart’s edge is local reliability, transparent pricing and store-level visibility.</p></div>`}
function customer(){const {p,res}=search();S.last=res;const M=[['reliable','Most reliable'],['fastest','Fastest'],['local','Best local option']];
 const list=!p?`<div class="card">No product matches “${esc(S.q)}”. Try Milk, Bread, Eggs, Curd, Paneer, Atta or Rice.</div>`:res.length?res.map((r,i)=>`<div class="card pop"><div class="row" style="align-items:center"><div><b>${esc(r.p)}</b><div class="mut">${esc(r.s.name)} · ${r.inv}% inventory · ${r.eta} min ETA</div></div><span class="pill ${r.score>=85?'ok':r.score>=70?'wn':'bd'}">${r.score}%</span></div><div class="mut" style="margin:8px 0">${meter(r.score,'var(--pri)')}</div><div class="row"><span class="pill tag">${r.rel}% reliability</span>${r.inv<80?`<span class="pill wn">Stock risk</span>`:''}</div><div class="chips" style="margin-bottom:0">${btn('add:'+i,'Add to cart','s')}${btn('mode:'+S.mode,'Compare','')}${btn('tab:pricing','Price details','s')}</div></div>`).join(''):`<div class="card">No stores available for “${esc(S.q)}”.</div>`;
 const c=S.cart;const cartH=c?`<div style="font-size:14px"><div class="row" style="align-items:center"><b>${c.p}</b><span>${btn('qty:-1','−','s')} <b>${c.qty}</b> ${btn('qty:1','+','s')}</span></div><div class="mut">${esc(c.sn)} · ₹${c.pr} each</div>${btn('place','Place order','s')}</div>`:'<div class="mut">No item in cart</div>';
 const riskH=S.risk?`<div class="card warnbox pop"><b>${S.risk.from.p} just became unavailable at ${S.risk.from.sn}</b><p class="mut" style="margin:4px 0 10px">Choose a fix before the order is confirmed.</p>${S.risk.alt?`<button class="btn s" data-a="swap:alt">Use ${S.risk.alt.p} from ${S.risk.alt.s.name}</button>`:''}${S.risk.sub?`<button class="btn s" data-a="swap:sub">Switch to ${S.risk.sub.p}</button>`:''}${btn('dismiss','Dismiss','d')}</div>`:'';
 return`<div class="cols"><div><input type="text" id="q" value="${esc(S.q)}" placeholder="Search milk, bread, eggs…" aria-label="Search products"><div class="chips">${M.map(m=>`<button class="chip ${S.mode===m[0]?'on':''}" data-a="mode:${m[0]}">${m[1]}</button>`).join('')}</div>${list}</div><div><div class="card"><b>Your cart</b><div style="margin-top:8px">${cartH}</div></div>${riskH}</div></div>`}
function store(){return`<div class="card"><h2>Store overview</h2><p class="mut">This demo focuses on store health and fulfillment signals for NOVA Cart.</p></div>`}
function deliveryV(){return`<div class="card"><h2>Delivery partner</h2><p class="mut">Live delivery tracking and partner tools are available in this web experience.</p></div>`}
function ops(){return`<div class="card"><h2>Operations</h2><p class="mut">Performance and store operations metrics for NOVA Cart.</p></div>`}
function pricingV(){return`<div class="card"><h2>Pricing</h2><p class="mut">Transparent pricing and order totals for NOVA Cart.</p></div>`}
function shopsV(){return`<div class="card"><h2>Shops</h2><p class="mut">Nearby stores and map access for NOVA Cart.</p></div>`}
function join(){return`<div class="card"><h2>Create your NOVA CART account</h2><p class="mut">Two-step verification: we confirm your mobile number, then your email.</p></div>`}
const TABS=[['story','Story'],['customer','Customer'],['store','Store'],['delivery','Delivery'],['ops','Operations'],['pricing','Pricing'],['shops','Shops'],['join','Register']];
function render(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart,df=a&&a.dataset&&a.dataset.f;
 document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab:${k}">${l}</button>`).join('');
 document.getElementById('app').innerHTML=({story,customer,store,delivery:deliveryV,ops,pricing:pricingV,shops:shopsV,join})[S.tab]();
 if(df&&['customer','delivery'].includes(S.tab)){const e=document.querySelector('[data-f="'+df+'"]');if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
 if(id==='q'){const e=document.getElementById('q');e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const [a,x]=el.dataset.a.split(':');
 if(a==='tab'){S.tab=x;scrollTo(0,0)}
 else if(a==='mode'){S.mode=x}
 else if(a==='add'){const item=S.last[+x];S.cart=fresh(item);S.msg='';S.risk=null}
 else if(a==='qty'){S.cart.qty=Math.max(1,Math.min(10,S.cart.qty+ +x))}
 else if(a==='place'){S.pay={step:'choose',method:'phonepe',bank:'',ctype:'credit',err:''};S.msg=''}
 else if(a==='dismiss'){S.risk=null}
 else if(a==='swap'){S.cart={...fresh(S.risk.from),qty:S.risk.from.qty};S.risk=null}
 render();});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='q'){S.q=el.value;render()}});
render();
</script>
</body>
</html>
