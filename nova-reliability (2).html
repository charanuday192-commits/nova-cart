<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA Reliability</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1e1b3a;--mut:#6b6785;--line:#e4e0f7;--pri:#5b4bd5;--prid:#4636b8;--soft:#eeebff;--hd:#1b1445;--okb:#d9f5e5;--okf:#0c6b3a;--wb:#fdf0c9;--wf:#8a5a00;--bb:#fde0e0;--bf:#a11d1d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12101f;--card:#1c1930;--ink:#ece9ff;--mut:#a29fc0;--line:#322d52;--soft:#2a2550;--okb:#12392a;--okf:#7be0a8;--wb:#3e3210;--wf:#f2c864;--bb:#47191d;--bf:#ff9a9a}}
:root[data-theme="dark"]{--bg:#12101f;--card:#1c1930;--ink:#ece9ff;--mut:#a29fc0;--line:#322d52;--soft:#2a2550;--okb:#12392a;--okf:#7be0a8;--wb:#3e3210;--wf:#f2c864;--bb:#47191d;--bf:#ff9a9a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.bar0{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px}.logo b{color:#b7acff}
nav{display:flex;flex-wrap:wrap;gap:4px}nav button{background:none;border:0;color:#fff;padding:8px 12px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button.on{background:var(--pri)}
h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0;max-width:760px}
h2{margin:0 0 6px;font-size:20px}
.hero{background:linear-gradient(135deg,#4f3fcf,#7a3fc0);color:#fff;border-radius:24px;padding:clamp(24px,5vw,48px)}
.hero p{max-width:620px;color:#e3defe}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:20px}@media(max-width:860px){.cols{grid-template-columns:1fr}}
.btn{border:0;border-radius:12px;padding:9px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;background:var(--pri);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn:hover{background:var(--prid)}
.btn.s{background:var(--soft);color:var(--pri)}.btn.d{background:var(--bb);color:var(--bf)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.ok{background:var(--okb);color:var(--okf)}.wn{background:var(--wb);color:var(--wf)}.bd{background:var(--bb);color:var(--bf)}.tag{background:var(--pri);color:#fff}.tg2{background:var(--soft);color:var(--pri)}
.mut{color:var(--mut);font-size:13px}.big{font-size:26px;font-weight:800}
.meter{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;transition:width .6s}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
input[type=text],input[type=password],select{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--pri);font:600 13px inherit;font-family:inherit;cursor:pointer}.chip.on{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 8px;text-align:left;border-top:1px solid var(--line)}th{border:0;color:var(--mut)}
.scroll{overflow-x:auto}.pop{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}.bars i{display:block;width:100%;border-radius:6px 6px 0 0}
.warnbox{border:2px solid #e0a800;background:var(--wb)}
.thumb{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pri);font-size:30px;flex:none}.ph{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0}a.btn{text-decoration:none;display:inline-block}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.opt.on{border-color:var(--pri);background:var(--soft)}.opt i{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:800 12px inherit;font-style:normal;color:#fff;flex:none}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--pri);margin:0 auto 12px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.pulse{animation:pl 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{from{transform:scale(1);opacity:.6}to{transform:scale(2.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.pop,.meter i,.spin,.pulse{animation:none;transition:none}}
</style>
</head>
<body>
<header><div class="wrap bar0"><div class="logo">NOVA <b>Reliability</b></div><nav id="nav"></nav></div></header>
<main class="wrap" id="app"></main>
<script>
// ---------- Synthetic data (NOVA CART case) ----------
const stores=[
{id:'s1',name:'Sai Lakshmi Stores',rel:.94,eta:24,dist:1.2,load:.45,local:.9,orders:212,fulfil:94},
{id:'s2',name:'City Fresh Mart',rel:.88,eta:31,dist:2.1,load:.6,local:.5,orders:340,fulfil:88},
{id:'s3',name:'Local Basket',rel:.81,eta:35,dist:2.8,load:.35,local:.8,orders:158,fulfil:81},
{id:'s4',name:'Metro Daily',rel:.9,eta:28,dist:1.8,load:.5,local:.4,orders:275,fulfil:90}];
const CITY={'Visakhapatnam':[17.6868,83.2185],'Vizianagaram':[18.1067,83.3955],'Srikakulam':[18.2949,83.8938],'Anakapalli':[17.6913,83.0037]};
const GEO={s1:[17.6935,83.2250],s2:[17.6800,83.2102],s3:[17.7005,83.2060],s4:[17.6760,83.2340]};
function shopArt(n,h){const e=n.replace(/&/g,'&amp;'),st=[0,1,2,3,4,5,6,7].map(i=>`<rect x="${30+i*32.5}" y="62" width="32.5" height="26" fill="${i%2?'#fff':`hsl(${h} 65% 48%)`}"/>`).join('');
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><rect width="320" height="200" fill="hsl(${h} 40% 90%)"/><rect y="160" width="320" height="40" fill="#b9b4a8"/><rect x="30" y="38" width="260" height="122" fill="#f7f2e8"/><rect x="60" y="14" width="200" height="26" rx="5" fill="hsl(${h} 55% 30%)"/><text x="160" y="32" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">${e}</text>${st}<rect x="48" y="100" width="90" height="46" fill="#cfe3ee"/><rect x="170" y="96" width="52" height="64" fill="hsl(${h} 45% 35%)"/><rect x="236" y="100" width="40" height="46" fill="#cfe3ee"/><text x="312" y="194" text-anchor="end" font-family="sans-serif" font-size="9" fill="#555">Illustration</text></svg>`;
 return'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
stores.forEach((s,i)=>{[s.lat,s.lng]=GEO[s.id];s.city='Visakhapatnam';s.addr='Sample position near the city centre';s.photo=shopArt(s.name,[255,150,30,330][i])});
const LISTED=[['Vizianagaram','Fort Road Fresh Mart',18.1089,83.3921,.92,265],['Vizianagaram','Sri Lakshmi Kirana',18.1031,83.4002,.87,25],['Srikakulam','Seven Roads Daily Needs',18.2975,83.8970,.91,200],['Srikakulam','Palakonda Road Mart',18.2920,83.8895,.85,350],['Anakapalli','Bellam Market Store',17.6942,83.0071,.93,45],['Anakapalli','Nehru Chowk Fresh',17.6881,82.9968,.86,170]]
 .map(([city,name,lat,lng,rel,h],i)=>({id:'L'+i,name,city,lat,lng,rel,addr:'Sample position near the city centre',photo:shopArt(name,h)}));
const cat=[['Milk',28,[96,71,82,0]],['Toned Milk',26,[92,85,0,88]],['Curd',35,[90,78,84,80]],['Bread',40,[88,90,70,86]],['Pav',30,[85,0,76,82]],['Eggs (6)',54,[93,80,0,91]],['Paneer',95,[84,91,66,0]],['Atta (5kg)',245,[95,92,88,94]],['Rice (5kg)',320,[90,0,85,93]]];
const subs={Milk:['Toned Milk','Curd'],'Toned Milk':['Milk','Curd'],Bread:['Pav'],Pav:['Bread'],Curd:['Milk']};
const base={orders:38500,aov:486,repeat:27,cancel:11,delivery:37,tickets:5900,unavail:35};
const trend={m:['Apr','May','Jun','Jul','Aug','Sep'],repeat:[41,38,34,31,29,27],cancel:[6,7,8,9,10,11],delivery:[29,31,33,34,36,37],tickets:[3100,3600,4200,4800,5400,5900]};
let inv=[],exc=[],orders=[],seq=1;
function seed(){inv=[];exc=[];orders=[];seq=1;
 cat.forEach(([p,pr,cs])=>cs.forEach((c,i)=>c>0&&inv.push({sid:stores[i].id,p,pr:pr+[0,2,-1,1][i],conf:c,on:true})));
 inv.filter(i=>i.conf<75).forEach(i=>exc.push({id:seq++,sid:i.sid,p:i.p,conf:i.conf,open:true,why:i.conf<70?'Not updated for 2+ days':'Stock last confirmed 36h ago'}));}
seed();
// ---------- Decision engine ----------
const W={reliable:{inv:.4,rel:.3,eta:.15,dist:.1,cap:.05,local:0},fastest:{inv:.2,rel:.15,eta:.4,dist:.2,cap:.05,local:0},local:{inv:.3,rel:.2,eta:.1,dist:.15,cap:.05,local:.2}};
const cl=x=>Math.max(0,Math.min(1,x)),pc=x=>Math.round(x*1000)/10;
function rank(p,mode,ex=[]){const w=W[mode];
 return inv.filter(i=>i.p===p&&i.on&&!ex.includes(i.sid)).map(i=>{const s=stores.find(x=>x.id===i.sid);
  const v={inv:i.conf/100,rel:s.rel,eta:cl(1-(s.eta-15)/45),dist:cl(1-s.dist/5),cap:1-s.load,local:s.local};
  const score=Object.keys(w).reduce((a,k)=>a+w[k]*v[k],0);
  return{s,p,pr:i.pr,inv:i.conf,rel:pc(s.rel),eta:s.eta,dist:s.dist,load:Math.round(s.load*100),score:pc(score),parts:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,pc(x)]))}})
 .sort((a,b)=>b.score-a.score).map((r,k)=>({...r,rank:k}));}
function search(){const q=S.q.trim().toLowerCase();const names=[...new Set(inv.map(i=>i.p))].filter(n=>n.toLowerCase().includes(q));
 const p=names.find(n=>n.toLowerCase()===q)||names[0];return{p,res:p?rank(p,S.mode):[]};}
function stockout(){const c=S.cart;const row=inv.find(i=>i.p===c.p&&i.sid===c.sid);row.on=false;row.conf=0;
 if(!exc.some(e=>e.p===c.p&&e.sid===c.sid&&e.open))exc.push({id:seq++,sid:c.sid,p:c.p,conf:0,open:true,why:'Picker reported item missing during an order'});
 const alt=rank(c.p,S.mode,[c.sid])[0]||null;const ss=(subs[c.p]||[]).flatMap(p=>rank(p,S.mode));
 const sub=ss.find(r=>r.s.id===c.sid)||ss.sort((a,b)=>b.score-a.score)[0]||null;S.risk={from:c,alt,sub};}
const status=o=>({placed:'Placed',accepted:'Rider assigned',picked:'Out for delivery',delivered:'Delivered'})[o.st];
// ---------- UI helpers ----------
const S={tab:'story',q:'Milk',mode:'reliable',cart:null,risk:null,msg:'',store:'s1',sort:'fulfil',r:60,last:[],reg:R0(),user:null,me:{lat:17.6868,lng:83.2185,src:'demo'},city:'Visakhapatnam',trav:'driving',ssort:'dist',pc:{p:'Milk',sid:'s1',qty:1},coupon:'',cerr:'',pay:null,payFail:false,rider:{id:'D1',name:'Ravi Kumar',veh:'Bike',online:false,mode:'off',loc:null,err:'',wid:null,tm:null},merr:'',perr:''};
const inr=n=>'₹'+n.toLocaleString('en-IN'),esc=s=>String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const t=(v,g=85,w=70)=>v>=g?'ok':v>=w?'wn':'bd';
const pill=(v,x)=>`<span class="pill ${t(v)}">${x}</span>`;
const meter=(v,c)=>`<div class="meter"><i style="width:${v}%;background:${c||'var(--pri)'}"></i></div>`;
const kpi=(l,v,s,bad)=>`<div class="card" style="margin:0"><div class="mut">${l}</div><div class="big">${v}</div><div class="mut" style="${bad?'color:var(--bf)':''}">${s}</div></div>`;
const bars=(ti,vals,u,c)=>{const mx=Math.max(...vals);return`<div class="card" style="margin:0"><b>${ti}</b><div class="bars" style="margin-top:12px">${vals.map((v,i)=>`<div>${v}${u}<i style="height:${v/mx*70}%;background:${c}"></i>${trend.m[i]}</div>`).join('')}</div></div>`};
const btn=(a,l,k='',d='')=>`<button class="btn ${k}" data-a="${a}" ${d}>${l}</button>`;
const fresh=r=>({s:r.s.id,sn:r.s.name,p:r.p,pr:r.pr,eta:r.eta,inv:r.inv,dist:r.dist,qty:1});
// ---------- Views ----------
function story(){const st=[['Problem','Orders grew, but trust fell: cancellations 6% → 11%, repeat purchase 41% → 27%, delivery 29 → 37 min.'],['Insight','35% of cancellations come from unavailable products. Partner stores update stock only every 1–3 days.'],['Solution','Stop promising what stores cannot deliver. Route each order to the store most likely to fulfil it.'],['Product','A customer app with visible confidence, a store exception queue and an operations dashboard.'],['AI Logic','A weighted score of inventory confidence, store reliability, ETA, distance and capacity, tuned to the customer’s preference.'],['Business Impact','Fewer failed orders mean fewer tickets and better retention. Shown as a simulation, not a result.']];
 return`<div class="hero"><h1>From growth at any cost to reliable local commerce</h1><p>NOVA Reliability tells customers how likely their order is to arrive complete, and helps 620 partner stores fix only the stock records that matter.</p><div class="chips">${btn('tab:customer','Try the customer demo')} ${btn('tab:ops','See business impact','s')}</div></div>
 <div class="g g2" style="margin:18px 0">${st.map(([a,b],i)=>`<div class="card" style="margin:0"><div class="mut">Step ${i+1}</div><b style="font-size:18px">${a}</b><p class="mut" style="margin:6px 0 0">${b}</p></div>`).join('')}</div>
 <div class="card" style="background:var(--soft)"><h2>Why NOVA Reliability?</h2><p style="max-width:720px;margin:0">Quick-commerce rivals compete on discounts and speed. NOVA CART’s edge is local stores with wide assortments, so its promise has to be dependable: show real availability, pick the store most likely to deliver, and substitute smartly when stock fails.</p></div>`;}
function customer(){const {p,res}=search();S.last=res;const M=[['reliable','Most reliable'],['fastest','Fastest'],['local','Best local option']];
 const list=!p?`<div class="card">No product matches “${esc(S.q)}”. Try Milk, Bread, Eggs, Curd, Paneer, Atta or Rice.</div>`:res.length?res.map((r,i)=>`<div class="card pop"><div class="row"><div><b>${r.s.name}</b> ${r.rank===0?'<span class="pill tag">Recommended</span>':r.rank===1?'<span class="pill tg2">Backup store</span>':''}<div class="mut">${r.p} · ${inr(r.pr)} each · delivery ${inr(bill({pr:r.pr,qty:1,dist:r.dist}).dl)} ${r.pr===Math.min(...res.map(x=>x.pr))?'<span class="pill ok">Lowest price</span>':''}</div><div style="margin-top:6px">${pill(r.inv,r.inv+'% availability confidence')}${pill(100-r.eta,r.eta+' min ETA')}${pill(r.rel,r.rel+'% store reliability')}</div><div class="mut">${r.dist} km away · store workload ${r.load}%</div></div><div style="text-align:right"><div class="big" style="color:var(--pri)">${r.score}</div><div class="mut">reliability score</div><div style="margin-top:8px">${btn('add:'+i,'Add to cart')} <a class="btn s" href="${navUrl(r.s)}" target="_blank" rel="noopener">Navigate</a></div></div></div><div style="margin-top:10px">${meter(r.score,r.score>80?'#1faa63':r.score>65?'#e0a800':'#d64545')}</div></div>`).join(''):'<div class="card">This product is unavailable at every nearby store right now.</div>';
 const why=res.length?`<div class="card scroll"><b>Why this ranking?</b> <span class="mut">(${M.find(m=>m[0]===S.mode)[1]} weights)</span><table><tr>${['Store','Inventory','Reliability','ETA','Distance','Capacity','Local'].map(h=>`<th>${h}</th>`).join('')}</tr><tr class="mut"><td>weight</td>${['inv','rel','eta','dist','cap','local'].map(k=>`<td>${Math.round(W[S.mode][k]*100)}%</td>`).join('')}</tr>${res.map(r=>`<tr><td><b>${r.s.name}</b></td>${['inv','rel','eta','dist','cap','local'].map(k=>`<td>${r.parts[k]}</td>`).join('')}</tr>`).join('')}</table></div>`:'';
 const c=S.cart;const cartH=S.pay&&c?payV(c):c?`<div style="font-size:14px"><div class="row" style="align-items:center"><b>${c.p}</b><span>${btn('qty:-1','−','s')} <b>${c.qty}</b> ${btn('qty:1','+','s')}</span></div><div class="mut">${c.sn} · ${c.eta} min · ${c.inv}% confidence</div>${billH(c,S.coupon)}${couponUI()}<div class="chips">${btn('place','Continue to payment · '+inr(bill(c,S.coupon).total))}${btn('sim','Simulate stock-out','d')}${btn('clear','Clear','s')}</div></div>`:'<p class="mut">Add a product from a recommended store to start.</p>';
 const rk=S.risk,sw=x=>`<div class="card" style="margin:0 0 8px;background:var(--card)"><b>${x[0]}</b><div style="font-size:14px">${x[1]}</div><div style="margin-top:8px">${btn('swap:'+x[2],x[3])}</div></div>`;
 const riskH=rk?`<div class="card warnbox pop"><b>${rk.from.p} just became unavailable at ${rk.from.sn}</b><p class="mut" style="margin:4px 0 10px">Choose a fix before the order is confirmed.</p>${rk.alt?sw(['Same product, other store',`${rk.alt.s.name} · ${rk.alt.inv}% confidence · new ETA ${rk.alt.eta} min`,'alt','Switch store']):''}${rk.sub?sw(['Substitute product',`${rk.sub.p} at ${rk.sub.s.name} · ${inr(rk.sub.pr)} · ${rk.sub.inv}% confidence · ETA ${rk.sub.eta} min`,'sub','Accept substitute']):''}${btn('dismiss','Dismiss','s')}</div>`:'';
 const ord=orders.length?orders.map(o=>{const s=status(o);return`<div style="border-top:1px solid var(--line);padding:8px 0;font-size:14px"><div class="row"><b>${o.id}</b>${pill(s==='Delivered'?100:75,s)}</div><div class="mut">${o.item.p} × ${o.item.qty} · ${o.item.sn} · ${inr(o.bd.total)} paid via ${o.pay.label} · ETA ${o.item.eta} min · ${o.item.inv}% confidence</div>${meter({Placed:15,'Rider assigned':40,'Out for delivery':75,Delivered:100}[s],'#1faa63')}</div>`}).join(''):'<p class="mut">No orders yet.</p>';
 return`<div class="cols"><div><input type="text" id="q" value="${esc(S.q)}" placeholder="Search milk, bread, eggs…" aria-label="Search products"><div class="chips">${M.map(m=>`<button class="chip ${S.mode===m[0]?'on':''}" data-a="mode:${m[0]}">${m[1]}</button>`).join('')}</div>${list}${why}</div>
 <div><div class="card"><b>Your cart</b><div style="margin-top:8px">${cartH}</div>${S.msg?`<div class="pill ok pop" style="margin-top:10px">${S.msg}</div>`:''}</div>${riskH}${orders.filter(o=>o.st!=='delivered').map(trackV).join('')}<div class="card"><div class="row"><b>Order history</b><button class="chip" data-a="reset">Reset demo</button></div>${ord}</div></div></div>`;}
function store(){const s=stores.find(x=>x.id===S.store);const live=orders.filter(o=>o.item.s===s.id&&status(o)!=='Delivered').length;const load=Math.min(100,Math.round(s.load*100+live*8));
 const ex=exc.filter(e=>e.sid===s.id&&e.open),os=orders.filter(o=>o.item.s===s.id),its=inv.concat().filter(i=>i.sid===s.id);
 return`<div class="row" style="margin-bottom:14px;align-items:center"><b>Store</b><select id="st" style="max-width:300px">${stores.map(x=>`<option value="${x.id}" ${x.id===S.store?'selected':''}>${x.name}</option>`).join('')}</select></div>

const TABS=[['story','Story'],['customer','Customer'],['store','Store'],['delivery','Delivery'],['ops','Operations'],['pricing','Pricing'],['shops','Shops'],['join','Register']];
function render(){setTimeout(()=>{if(S.tab==='join'){const c=document.querySelector('[data-f=code]');if(c)c.focus()}});const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart,df=a&&a.dataset&&a.dataset.f;
 document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab:${k}">${k==='join'&&S.user?'Account':l}${k==='customer'&&S.cart?' (1)':''}</button>`).join('')+(S.user?`<span class="pill" style="background:#2e2670;color:#fff;margin-left:6px">${esc(S.user.name.split(' ')[0])} · ${S.user.role==='vendor'?'Vendor':'Customer'}</span>`:'');
 document.getElementById('app').innerHTML=({story,customer,store,delivery:deliveryV,ops,pricing:pricingV,shops:shopsV,join})[S.tab]();
 if(df&&(S.tab==='customer'||S.tab==='delivery')){const e=document.querySelector('[data-f="'+df+'"]');if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
 if(id==='q'){const e=document.getElementById('q');e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const [a,x,y]=el.dataset.a.split(':');
 if(a==='tab'){S.tab=x;scrollTo(0,0)}
 else if(a==='mode'){S.mode=x}
 else if(a==='add'){S.cart=fresh(S.last[+x]);S.msg='';S.risk=null;S.pay=null}
 else if(a==='clear'){S.cart=null;S.pay=null}
 else if(a==='qty'){S.cart.qty=Math.max(1,Math.min(10,S.cart.qty+ +x))}
 else if(a==='coupon'){const code=(S.reg.f.coupon||'').trim().toUpperCase(),cp=COUPONS[code],b=bill(S.cart);if(!cp)S.cerr='That code isn’t valid. Try WELCOME20 or NOVA10.';else if(b.items<cp.min)S.cerr='Add '+inr(cp.min-b.items)+' more to use '+code+'.';else{S.coupon=code;S.cerr=''}}
 else if(a==='rmcoupon'){S.coupon='';S.cerr=''}
 else if(['pm','bank','ctype','paycancel','pf','pay'].includes(a)){payAct(a,x)}
 else if(['online','rgps','rsim','roff','accept','pickup','deliver'].includes(a)){rideAct(a,x)}
 else if(a==='sim'){stockout()}
 else if(a==='swap'){const r=S.risk[x];S.cart={...fresh(r),qty:S.risk.from.qty};S.risk=null;S.pay=null}
 else if(a==='dismiss'){S.risk=null}
 else if(a==='place'){S.pay={step:'choose',method:'phonepe',bank:'',ctype:'credit',err:''};S.msg=''}
 else if(a==='reset'){seed();sync();S.cart=null;S.risk=null;S.msg=''}
 else if(a==='res'){const ex=exc.find(z=>z.id===+x),row=inv.find(i=>i.sid===ex.sid&&i.p===ex.p);ex.open=false;row.on=y==='1';row.conf=y==='1'?97:0}
 else if(a==='tog'){const row=inv.find(i=>i.sid===S.store&&i.p===x);row.on=!row.on;row.conf=row.on?95:0}
 else if(['role','next','vm','ve','resend','back','signout'].includes(a)){regAct(a,x)}
 else if(['saveloc','gps','rmphoto','mesave','megps','medemo','trav','city'].includes(a)){shopAct(a,x)}
 render();});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f==='cardno'){const d=el.value.replace(/\D/g,'').slice(0,19);el.value=d.replace(/(.{4})/g,'$1 ').trim();const bl=document.getElementById('brand');if(bl)bl.textContent=brand(d)}
 if(el.dataset.f==='cardexp'){const d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d}
 if(el.dataset.f==='cardcvv')el.value=el.value.replace(/\D/g,'').slice(0,4);
 if(el.dataset.f){S.reg.f[el.dataset.f]=el.value;return}
 if(el.id==='q'){S.q=el.value;render()}
 else if(el.id==='r'){S.r=+el.value;document.getElementById('rv').textContent=S.r+'%';document.getElementById('imp').innerHTML=imp()}});
document.addEventListener('change',e=>{if(e.target.dataset.pc){const k=e.target.dataset.pc;S.pc[k]=e.target.value;if(k==='p')S.pc.sid='';render();return}if(e.target.id==='photo'){handlePhoto(e.target);return}if(e.target.id==='ssort'){S.ssort=e.target.value;render();return}if(e.target.id==='st'){S.store=e.target.value;render()}if(e.target.id==='so'){S.sort=e.target.value;render()}});
setInterval(()=>{if(orders.length&&(S.tab==='customer'||S.tab==='store')&&!(document.activeElement&&document.activeElement.id==='q'&&0))render()},2000);
render();
</script>
</body>
